<!doctype html>
<meta charset="utf-8">
<title>Job application checks</title>
<pre id="job-check-result">Running…</pre>
<script>
(async () => {
  const result = document.getElementById("job-check-result");
  const assert = (condition, message) => { if (!condition) throw new Error(message); };
  const keys = ["lifeAgainSave", "lifeAgainAchievements", "lifeAgainAchievementQueue"];
  const saved = keys.map(key => localStorage.getItem(key));
  const random = Math.random;
  try {
    const { createInitialState, state } = await import("../js/core/state.js");
    const { getJobApplicationBlocker, createGraduationNotice, GRADUATION_AGE } = await import("../js/career/job-applications.js");
    const { createEmploymentEvent, createJobInterview } = await import("../js/career/career-jobs.js");
    const { getCareerAnnualSalary } = await import("../js/career/career-salary.js");
    const { getEducationStatus } = await import("../js/education/education.js");
    const { careerPaths } = await import("../js/career/career-event.js");
    const path = { id: "programming", field: "Công nghệ thông tin", school: { id: "test", name: "Đại học Thử nghiệm" } };
    const student = extra => ({ ...createInitialState().player, age: 21, health: 80, careerPath: path, ...extra });

     
    assert(!createEmploymentEvent(student(), 22), "No automatic interview without the age-16 milestone");
    assert(!createEmploymentEvent(student({ careerSpark: "acting" }), 22), "A milestone in another career does not count");
    assert(createEmploymentEvent(student({ careerSpark: "programming" }), 22)?.kind === "job-interview", "Milestone keeps the automatic interview");
    assert(!createEmploymentEvent(student({ age: 24, employmentStatus: "unemployed" }), 25), "No yearly retry prompt without the milestone");
    assert(createEmploymentEvent(student({ age: 24, employmentStatus: "unemployed", careerSpark: "programming" }), 25)?.kind === "job-interview-retry",
      "Milestone keeps the yearly retry prompt");
     
    const { careerMilestones } = await import("../js/career/career-milestones-data.js");
    const { createInterviewResult, createInterviewRetryPrompt } = await import("../js/career/career-jobs.js");
    for (const [id, data] of Object.entries(careerMilestones).filter(([id]) => id !== 'study-abroad')) {
      const linked = student({ careerPath: { id, field: data.field, school: { name: "Trường thử" } }, careerSpark: id });
      const interview = createEmploymentEvent(linked, 22);
      const challenge = data.spark.title.replace(/^\S+\s/u, "");
      assert(interview.text.includes(data.mentor) && interview.text.includes(challenge) && interview.text.includes("16 tuổi"),
        `Interview recalls the age-16 mentor and challenge: ${id}`);
      assert(createInterviewResult(linked, true, 22).content.includes(challenge) &&
        createInterviewResult(linked, false, 22).content.toLowerCase().includes(data.mentor.toLowerCase()), `Result comes from the mentor: ${id}`);
      assert(createInterviewRetryPrompt({ ...linked, age: 23 }).text.includes(data.mentor), `Retry call comes from the mentor: ${id}`);
      assert(interview.choices.filter(c => c.correct).length === 2 && interview.choices.length === 3, `Interview keeps its answers: ${id}`);
    }
    assert(!createJobInterview(student({ age: 22 })).text.includes("16 tuổi"), "Applicants without the milestone get the normal interview");
     
    assert(getJobApplicationBlocker(student()).includes("Học xong"), "Cannot apply before graduating");
    assert(getJobApplicationBlocker(student({ age: GRADUATION_AGE })) === "", "Graduates can apply");
    assert(getJobApplicationBlocker(student({ age: 30, employmentStatus: "employed", job: "x" })).includes("đang làm"), "Workers cannot apply");
    assert(getJobApplicationBlocker(student({ age: 62 })).includes("nghỉ hưu"), "Retirees cannot apply");
    assert(getJobApplicationBlocker(student({ age: 30, jobAppliedAtAge: 30 })).includes("Năm nay"), "One application per year");
    assert(createGraduationNotice(student({ age: 22 }), 22)?.content.includes("Xin việc"), "Graduation notice points to Xin việc");
    assert(!createGraduationNotice(student({ age: 22, careerSpark: "programming" }), 22), "No notice for the automatic interview");
    assert(getEducationStatus(student({ age: 23 })).text === "Chưa có việc làm", "Graduates without a job are not students");

    const html = await (await fetch("../index.html")).text();
    const parsed = new DOMParser().parseFromString(html, "text/html");
    parsed.querySelectorAll("script").forEach(element => element.remove());
    parsed.querySelectorAll("[src]").forEach(element => element.removeAttribute("src"));
    document.body.insertAdjacentHTML("beforeend", parsed.body.innerHTML);
    localStorage.setItem("lifeAgainAchievements", "{}");
    localStorage.setItem("lifeAgainAchievementQueue", "[]");
    document.getElementById("game-screen").hidden = false;
    document.getElementById("lobby-screen").hidden = true;
    const player = extra => ({ name: "Test", gender: "male", age: 21, health: 80, happiness: 50, intelligence: 50,
      appearance: 50, money: 0, studyBlock: "A00", datingActivitiesOnly: true, careerPath: path, ...extra });
    Object.assign(state, createInitialState());
    Object.assign(state.player, player());
    Math.random = () => 0.99;
    await import("../js/main.js");
    const $ = id => document.getElementById(id);
    const body = () => $("job-body");
    const closeAll = () => document.querySelectorAll("dialog[open]").forEach(d => d.close());
    const open = () => { closeAll(); $("activities").click(); $("activity-jobs").click(); };
    const careerButton = id => body().querySelector(`.job-career[data-career="${id}"]`);
    const answer = correct => [...body().querySelectorAll(".job-answer")][state.player.jobInterview.choices.findIndex(c => c.correct === correct)].click();

     
    open();
    assert($("job-dialog").open && body().querySelectorAll(".job-career").length === careerPaths.length, "Lists every career");
    assert(careerButton("programming").disabled && body().textContent.includes("Học xong"), "Students cannot apply yet");

     
    closeAll();
    $("age-up").click();
    assert(state.player.age === 22 && !state.pendingEvent, "No interview popup at 22 without the milestone");
    assert(state.logs.at(-1).content.includes("Xin việc"), "Year-22 log points to Xin việc");

     
    open();
    const first = body().querySelector(".job-career");
    assert(first.dataset.career === "programming" && !first.disabled, "Studied career first and enabled");
    assert([...body().querySelectorAll(".job-career")].filter(b => !b.disabled).length === 1, "Only the studied career is open");
    assert(careerButton("law").textContent.includes("Cần bằng ngành"), "Other careers need their degree");

     
    careerButton("programming").click();
    assert(state.player.jobInterview && JSON.parse(localStorage.getItem("lifeAgainSave")).player.jobInterview, "Interview is saved");
    const question = state.player.jobInterview.text;
    open();
    assert(body().querySelector(".job-answer") && state.player.jobInterview.text === question, "Reopening resumes the same question");
    answer(false);
    assert(state.player.employmentStatus === "unemployed" && !state.player.jobInterview && state.player.money === -24_000_000, "Failing leaves the player unemployed; graduation rent remains payable");
    open();
    assert(careerButton("programming").disabled && body().textContent.includes("Năm nay"), "One application per year");

     
    closeAll();
    $("age-up").click();
    assert(state.player.age === 23 && !state.pendingEvent, "No retry popup without the milestone");
    const before = state.player.money;
    open();
    careerButton("programming").click();
     
    const interviewRandom = Math.random;
    Math.random = () => 0;
    answer(true);
    Math.random = interviewRandom;
    const salary = getCareerAnnualSalary("programming", 1);
    assert(state.player.employmentStatus === "employed" && state.player.careerLevel === 1 && state.player.money === before + salary * 0.92,
      "Passing hires the player and pays the first year's salary");
    assert(state.player.lastSalaryAge === 23 && state.player.nextPromotionAge === 27, "Salary and first promotion are scheduled");
    assert(body().textContent.includes("Vượt qua") && state.logs.at(-1).content.includes("bắt đầu làm việc"), "Result and diary");
    open();
    assert(careerButton("programming").disabled && body().textContent.includes("đang làm"), "Workers cannot apply again");
     
    closeAll();
    state.player.age = 25;
    const logCount = state.logs.length;
    $("age-up").click();
    assert(state.player.age === 26 && state.logs.length === logCount + 1 && state.logs.at(-1).content.includes("Nhận lương năm"),
      "Salary continues on later birthdays");

     
    closeAll();
    Object.assign(state, createInitialState());
    Object.assign(state.player, player({ careerSpark: "programming" }));
    $("age-up").disabled = false;
    $("age-up").click();
    assert(state.pendingEvent?.kind === "job-interview", "Milestone players get the interview at 22 automatically");
    result.textContent = "PASS: automatic interview only with the age-16 milestone, told by its mentor for all 22 careers (interview, result, retry); Xin việc lists every career, only the studied one opens after graduating; saved question; one try per year; hire pays the first salary; no retry popup";
  } catch (error) {
    result.textContent = `FAIL: ${error.stack}`;
  } finally {
    Math.random = random;
    keys.forEach((key, index) => saved[index] === null ? localStorage.removeItem(key) : localStorage.setItem(key, saved[index]));
  }
})();
</script>
