<!doctype html>
<meta charset="utf-8">
<title>Intellect mechanic checks</title>
<pre id="intellect-check-result">Running…</pre>
<script>
(async () => {
  const result = document.getElementById("intellect-check-result");
  const assert = (condition, message) => { if (!condition) throw new Error(message); };
  const keys = ["lifeAgainSave", "lifeAgainAchievements", "lifeAgainAchievementQueue"];
  const saved = keys.map(key => localStorage.getItem(key));
  const random = Math.random;
  try {
    const { createInitialState, state } = await import("../js/core/state.js");
    const I = await import("../js/stats/intellect-rules.js");
    const T = await import("../js/career/career-tests.js");
    const { createInterviewResult, createPromotionEvent } = await import("../js/career/career-jobs.js");
    const { completeLifeYear } = await import("../js/relationships/family.js");
    const near = (a, b) => Math.abs(a - b) < 1e-9;

    // 1. Các mức trí tuệ.
    assert(["sharp", "steady", "developing", "struggling"].join() === [80, 79, 49, 29].map(v => I.getIntellectBand(v).id).join() &&
      I.getIntellectBand(50).id === "steady" && I.getIntellectBand(30).id === "developing", "Bands 80/50/30");

    // 3. Phỏng vấn: thông số khởi đầu, ví dụ trong yêu cầu.
    const chance = (intelligence, quality, extra = {}) => I.getInterviewChance({ age: 22, intelligence, ...extra }, quality, "programming").chance;
    assert(near(chance(30, "good"), 0.52) && near(chance(80, "good"), 0.72), "Good answer, unprepared: 52% at 30, 72% at 80");
    assert(near(chance(50, "acceptable"), 0.35) && near(chance(50, "weak"), 0.10), "Acceptable 35%, weak 10% at 50");
    assert(near(chance(50, "good", { interviewPrepAge: 22 }), 0.7), "Preparation adds 10 points");
    assert(chance(100, "weak", { interviewPrepAge: 22 }) <= 0.4 && chance(0, "weak") >= 0.05, "High intellect cannot rescue an irresponsible answer; 5–95% bounds");
    assert(chance(100, "good", { interviewPrepAge: 22 }) <= 0.95, "Upper bound 95%");
    assert(I.getInterviewChance({ intelligence: 90 }, "good", "acting").chance < I.getInterviewChance({ intelligence: 90 }, "good", "programming").chance,
      "Intellect weighs less in talent careers");
    const player = extra => ({ ...createInitialState().player, age: 21, health: 80, happiness: 60, intelligence: 50,
      careerPath: { id: "programming", field: "Công nghệ thông tin", school: { name: "Trường thử" } }, ...extra });
    const failedGood = createInterviewResult(player(), false, 22, I.rollInterview(player(), "good", () => 0.99));
    assert(failedGood.content.includes("được đánh giá tốt") && failedGood.content.includes("khả năng đỗ") && failedGood.content.includes("luyện phỏng vấn"),
      "A good answer is acknowledged as good even when not hired, with next steps");
    assert(createInterviewResult(player({ interviewPrepAge: 21 }), true, 22, I.rollInterview(player(), "good", () => 0)).updates.interviewPrepAge === null,
      "Preparation is used up by the interview");

    // 2. Thi cử: đáp án đúng luôn đỗ; đáp án sai phụ thuộc chuẩn bị và trí tuệ; có gợi ý, thi lại, đổi ngành.
    const career = { id: "law", field: "Luật" };
    const prep = T.createExamPrepEvent(career, { intelligence: 35 });
    assert(prep.choices.length === 4 && ["Ôn tập", "Học cùng", "Học dồn", "Không chuẩn bị"].every(word => prep.choices.some(c => c.label.includes(word))),
      "Four ways to prepare");
    assert(I.getExamOverallChance({ intelligence: 35 }, "group") > I.getExamOverallChance({ intelligence: 35 }, "steady"), "Studying together helps low-intellect students most");
    assert(I.getExamOverallChance({ intelligence: 80 }, "none") > I.getExamOverallChance({ intelligence: 30 }, "none"), "Without preparation ability matters more");
    assert(I.EXAM_PREP.cram.health < 0, "Cramming costs health");
    const lowTest = T.createCareerTest(career, () => 0.99, { player: { intelligence: 10 }, prep: "none" });
    const correct = lowTest.choices.find(c => c.correct);
    assert(correct && !("passedOverall" in correct), "A correct answer is always recorded as correct, even at low intellect");
    assert(!lowTest.text.includes("Gợi ý"), "No hint by default");
    const sharpTest = T.createCareerTest(career, () => 0.5, { player: { intelligence: 85 }, prep: "steady" });
    const hinted = sharpTest.text.match(/"(.+)" chắc chắn không phải đáp án đúng/u)?.[1];
    assert(hinted && sharpTest.choices.find(c => c.label === hinted)?.correct === false, "High intellect reveals a hint without changing the truth");
    const failed = T.createFailedTestEvent(career, 1);
    assert(failed.choices.some(c => c.retakeTest) && failed.choices.some(c => c.reselectCareer) && failed.choices.some(c => c.careerPath?.id === "military"),
      "Failing never locks every career: retake, choose again or enlist");
    assert(!T.createFailedTestEvent(career, 0).choices.some(c => c.retakeTest), "One retake");

    // Học bổng khuyến khích.
    const scholar = { ...player({ age: 18, intelligence: 85, money: 0, illnessPlan: [], illnesses: [], relatives: [] }), careerPath: { id: "law", school: { name: "Đại học Luật" } } };
    const year = completeLifeYear(scholar, 19);
    assert(year.tuition.amount === 10_000_000 && year.tuition.content.includes("học bổng"), "Scholarship halves tuition at 80+");

    // 4. Thăng chức: xử lý đúng là điều kiện cần, kết quả còn tùy kinh nghiệm, trí tuệ, thành tích.
    const worker = extra => ({ ...createInitialState().player, age: 30, intelligence: 50, employmentStatus: "employed", careerLevel: 1,
      careerPath: { id: "programming", field: "CNTT" }, employedSince: 25, nextPromotionAge: 31, ...extra });
    assert(I.getPromotionChance(worker({ intelligence: 80 }), 31) > I.getPromotionChance(worker({ intelligence: 30 }), 31), "Intellect helps promotion");
    assert(I.getPromotionChance(worker({ employedSince: 21 }), 31) > I.getPromotionChance(worker({ employedSince: 30 }), 31), "Experience helps promotion");
    assert(I.getPromotionChance(worker({ workMerit: 2 }), 31) > I.getPromotionChance(worker(), 31), "Merit from good work helps promotion");
    let rolls = [0, 0.99];
    const notSelected = createPromotionEvent(worker(), () => rolls.shift() ?? 0, 31);
    assert(notSelected.choices.every(c => c.correct === false && !c.careerLevel && c.title.includes("chưa đến lượt")),
      "An unlucky roll raises no one; every approach is acknowledged without an automatic raise");
    const odds = c => Number(c.label.match(/≈(\d+)%/)?.[1]);
    const push = notSelected.choices.find(c => c.label.includes("thức nhiều đêm"));
    const balanced = notSelected.choices.find(c => c.label.includes("phối hợp"));
    assert(push && balanced && odds(push) > odds(balanced) && push.effects.health < 0,
      "Pushing harder raises the odds but costs health: every approach is a trade-off");
    rolls = [0, 0];
    assert(createPromotionEvent(worker(), () => rolls.shift() ?? 0, 31).choices.some(c => c.careerLevel === 2), "Selected promotions raise the rank");
    // Sự cố dự án: trí tuệ cao mở phân tích; trí tuệ thấp vẫn có cách tốt; giấu lỗi có hậu quả.
    const bugSharp = I.createProjectBugEvent(worker({ intelligence: 85 }), 31, () => 0);
    const bugLow = I.createProjectBugEvent(worker({ intelligence: 20 }), 31, () => 0);
    assert(bugSharp.choices.some(c => c.label.includes("Phân tích")) && !bugLow.choices.some(c => c.label.includes("Phân tích")), "Analysis only for high intellect");
    assert(["Nhờ đồng nghiệp", "Chia nhỏ"].every(word => bugLow.choices.some(c => c.label.includes(word))), "Low intellect still has good options");
    assert(bugSharp.choices.find(c => c.label.includes("Giấu lỗi")).playerUpdates?.jobWarning &&
      bugSharp.choices.find(c => c.label.includes("Ôm hết")).effects.health < 0, "Hiding or overworking has consequences even at high intellect");
    assert(!I.createProjectBugEvent(worker({ careerPath: { id: "acting" } }), 31, () => 0), "Not every career gets technical bugs");

    // 5. Nhận diện rủi ro: trí tuệ cao thấy dấu hiệu; ai cũng có thể từ chối, kiểm tra; chấp nhận thì mất tiền.
    const offerSharp = I.createRiskOfferEvent({ money: 100_000_000, intelligence: 85 }, 30, () => 0);
    const offerLow = I.createRiskOfferEvent({ money: 100_000_000, intelligence: 30 }, 30, () => 0);
    assert(offerSharp.text.includes("🚩") && offerSharp.choices.some(c => c.label.includes("điều khoản")), "High intellect spots red flags");
    assert(!offerLow.text.includes("🚩") && ["Từ chối", "Kiểm tra"].every(word => offerLow.choices.some(c => c.label.includes(word))),
      "Everyone can refuse or check");
    assert(offerLow.choices.find(c => c.label.includes("tham gia ngay")).money === -30_000_000, "Accepting without checking loses money");
    assert(!offerSharp.choices.some(c => c.money > 0), "No guaranteed profit from intellect");

    // 7. Tuổi già: suy giảm nhẹ khác nhau; hoạt động trí óc giúp duy trì; không chẩn đoán bệnh.
    const elder = { age: 75, intelligence: 60, developmentDone: {} };
    const decline = I.collectCognitiveYear({ ...elder }, 76, () => 0.2);
    assert(decline && decline.content.includes("Trí tuệ -1") && !/bệnh|sa sút trí tuệ|Alzheimer/u.test(decline.content), "Mild decline, no diagnosis");
    assert(!I.collectCognitiveYear({ ...elder, developmentDone: { library: 75 } }, 76, () => 0.2), "Reading this year protects at the same roll");
    assert(!I.collectCognitiveYear({ ...elder }, 76, () => 0.9), "Not everyone declines");
    assert(!I.collectCognitiveYear({ age: 50, intelligence: 60 }, 51, () => 0), "No decline before old age");

    // Giao diện.
    const html = await (await fetch("../index.html")).text();
    const parsed = new DOMParser().parseFromString(html, "text/html");
    parsed.querySelectorAll("script").forEach(element => element.remove());
    parsed.querySelectorAll("[src]").forEach(element => element.removeAttribute("src"));
    document.body.insertAdjacentHTML("beforeend", parsed.body.innerHTML);
    localStorage.setItem("lifeAgainAchievements", "{}");
    localStorage.setItem("lifeAgainAchievementQueue", "[]");
    document.getElementById("game-screen").hidden = false;
    document.getElementById("lobby-screen").hidden = true;
    const { careerEvent } = await import("../js/career/career-event.js");
    Object.assign(state, createInitialState());
    Object.assign(state.player, { name: "Test", gender: "male", age: 17, health: 80, happiness: 60, intelligence: 30, appearance: 50,
      money: 0, studyBlock: "D01", illnessPlan: [], relatives: [], healthCheckAge: 17 });
    state.pendingEvent = { ...careerEvent, stage: "choice", age: 18 };
    Math.random = () => 0.99;
    await import("../js/main.js");
    const $ = id => document.getElementById(id);
    const choose = text => [...$("event-choices").querySelectorAll("button")].find(b => b.textContent.includes(text)).click();
    const next = () => $("event-confirm").click();
    // Chọn ngành → chuẩn bị → bài test.
    choose("Luật");
    if (state.pendingEvent.stage === "result") next();
    assert(state.pendingEvent.kind === "exam-prep" && state.pendingEvent.stage === "choice", "Choosing a career opens exam preparation");
    choose("Ôn tập");
    if (state.pendingEvent.stage === "result") next();
    assert(state.pendingEvent.kind === "career-test", "Then the test");
    const wrong = state.pendingEvent.choices.find(c => !c.correct);
    choose(wrong.label);
    next();
    assert(state.pendingEvent.kind === "enlistment-failure" && state.pendingEvent.choices.some(c => c.retakeTest), "A wrong answer with a failed overall score offers a retake");
    const before = state.player.intelligence;
    choose("thi lại");
    if (state.pendingEvent.stage === "result") next();
    assert(state.pendingEvent.kind === "exam-prep" && state.player.intelligence === before + 2, "Extra study raises intellect before the retake");
    choose("Học cùng");
    if (state.pendingEvent.stage === "result") next();
    choose(state.pendingEvent.choices.find(c => c.correct).label);
    next();
    assert(/trường|huấn luyện/u.test(state.pendingEvent.title ?? "") && state.pendingEvent.stage === "choice", "A correct answer passes on the retake");
    document.querySelectorAll("dialog[open]").forEach(d => d.close());
    // Rèn luyện: học miễn phí có giới hạn, khóa học tăng chậm khi đã cao.
    state.pendingEvent = null;
    Object.assign(state.player, { age: 30, intelligence: 85, money: 10_000_000, employmentStatus: "declined", developmentDone: {} });
    $("activities").click();
    $("activity-self-development").click();
    $("self-development-body").querySelector('.shop-group[data-stat="intelligence"]').click();
    const free = id => $("self-development-body").querySelector(`.dev-recover[data-activity="${id}"]`);
    assert(free("library") && free("study-together") && free("learn-at-work").disabled, "Free learning; learning at work needs a job");
    free("library").click();
    assert(state.player.intelligence === 86 && state.player.money === 10_000_000 && free("library").disabled, "Free reading: +1 when already sharp, once per year");
    const course = $("self-development-body").querySelector('.dev-buy[data-activity="language"][data-tier="standard"]');
    course.click();
    assert(state.player.intelligence === 88, "Paid courses still help at high intellect but at half effect (3 → 2)");
    result.textContent = "PASS: intellect bands; interview 60/35/10% + (I−50)×0.4 + 10% prep, 5–95%, weak answers stay weak; good answers acknowledged; exam prep (steady/group/cram/none), correct answers always pass, hints never change the truth, retake or change career; scholarship; promotion by handling + experience + intellect + merit; project bug options; risk offer red flags; free learning with yearly limit and diminishing returns; mild, varied cognitive aging without diagnosis";
  } catch (error) {
    result.textContent = `FAIL: ${error.stack}`;
  } finally {
    Math.random = random;
    keys.forEach((key, index) => saved[index] === null ? localStorage.removeItem(key) : localStorage.setItem(key, saved[index]));
  }
})();
</script>
