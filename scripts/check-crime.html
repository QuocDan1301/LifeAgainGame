<!doctype html>
<meta charset="utf-8">
<title>Crime integration checks</title>
<pre id="result">Running…</pre>
<script type="module">
const result = document.getElementById('result');
const assert = (value, message) => { if (!value) throw new Error(message); };
const keys = ['lifeAgainSave', 'lifeAgainAchievements', 'lifeAgainAchievementQueue'];
const saved = keys.map(key => localStorage.getItem(key));
try {
  const { state, createInitialState } = await import('../js/core/state.js');
  const html = await (await fetch('../index.html')).text();
  const parsed = new DOMParser().parseFromString(html, 'text/html');
  parsed.querySelectorAll('script').forEach(element => element.remove());
  parsed.querySelectorAll('[src]').forEach(element => element.removeAttribute('src'));
  document.body.insertAdjacentHTML('beforeend', parsed.body.innerHTML);
  document.getElementById('game-screen').hidden = false;
  document.getElementById('lobby-screen').hidden = true;
  localStorage.setItem('lifeAgainAchievements', '{}');
  localStorage.setItem('lifeAgainAchievementQueue', '[]');
  Object.assign(state, createInitialState());
  Object.assign(state.player, { age: 24, health: 80, happiness: 80, intelligence: 70,
    appearance: 70, money: 100_000_000, studyBlock: 'A00', employmentStatus: 'declined',
    nextPromotionAge: null, relatives: [], illnessPlan: [] });
  await import('../js/main.js');
  const $ = id => document.getElementById(id);
  $('activities').click(); $('activity-crime').click();
  assert($('crime-dialog').open, 'Crime dialog opens');
  const blocked = $('crime-dialog').querySelector('button');
  assert(blocked.disabled && blocked.textContent.includes('Cần mua'), 'Missing tool disables crime');
  const toolsButton = [...$('crime-dialog').querySelectorAll('button')].find(button => button.textContent.includes('Mua đạo cụ'));
  toolsButton.click();
  assert($('shop-dialog').open && document.querySelector('#shop-list h3').textContent.includes('Mua vật dụng'), 'Shortcut opens tool shopping');
  state.player.age = 17;
  document.querySelector('#shop-list .shop-back').click();
  document.querySelector('#shop-list [data-group="items"]').click();
  assert([...document.querySelectorAll('#shop-list .shop-buy')].every(button => button.disabled && button.textContent.includes('18')), 'Tools cannot be bought before age 18');
  state.player.age = 24;
  document.querySelector('#shop-list .shop-back').click();
  document.querySelector('#shop-list [data-group="items"]').click();
  const glove = [...document.querySelectorAll('#shop-list .shop-item')].find(card => card.querySelector('h4').textContent.includes('Găng tay'));
  glove.querySelector('.shop-buy').click();
  $('shop-cancel').click();
  assert(!state.player.purchases.some(item => item.id === 'crime-gloves'), 'Cancelled purchase grants no tool');
  glove.querySelector('.shop-buy').click();
  $('shop-confirm').click();
  assert(state.player.purchases.some(item => item.id === 'crime-gloves'), 'Confirmed purchase grants tool');
  assert(state.player.money === 99_800_000, 'Tool purchase deducts price');
  const ownedGlove = [...document.querySelectorAll('#shop-list .shop-item')].find(card => card.querySelector('h4').textContent.includes('Găng tay'));
  assert(ownedGlove.querySelector('.shop-buy').disabled, 'Cannot buy another copy of the same tool');
  assert(JSON.parse(localStorage.getItem('lifeAgainSave')).player.purchases.some(item => item.id === 'crime-gloves'), 'Tool ownership saved');
  $('close-shop').click();
  $('assets').click();
  assert($('life-items').textContent.includes('Găng tay'), 'Owned tool appears in assets');
  $('close-life-profile').click();
  $('activities').click(); $('activity-crime').click();
  assert(!$('crime-dialog').querySelector('button').disabled, 'Purchased tool unlocks matching crime');
  assert($('crime-dialog').querySelectorAll('button')[1].disabled, 'Other crime still requires its own tool');
  const original = Math.random;
  try { Math.random = () => 0; $('crime-dialog').querySelector('button').click(); }
  finally { Math.random = original; }
  assert(state.player.prison.releaseAge === 26, 'Arrest and sentence');
  assert(JSON.parse(localStorage.getItem('lifeAgainSave')).player.prison.releaseAge === 26, 'Sentence saved');
  $('crime-dialog').close();
  $('activities').click(); $('activity-food').click();
  assert(!$('food-dialog').open && $('crime-dialog').open, 'Outside activity blocked in prison');
  $('crime-dialog').close();
  $('age-up').click();
  assert(state.pendingEvent?.id === 'prison-year', 'Age 25 prison priority: ' + JSON.stringify({ pending: state.pendingEvent?.id, age: state.player.age, disabled: $('age-up').disabled, dialogs: [...document.querySelectorAll('dialog[open]')].map(d => d.id) }));
  $('event-choices').querySelector('button').click(); $('event-confirm').click();
  assert(state.player.age === 25 && state.player.prison, 'Prison year completes');
  $('age-up').click();
  assert(state.pendingEvent?.id === 'prison-release', 'Release story opens on time');
  $('event-choices').querySelector('button').click(); $('event-confirm').click();
  assert(state.player.age === 26 && state.player.prison === null, 'Release completes');
  $('assets').click();
  $('life-items').querySelector('.shop-sell').click();
  $('shop-confirm').click();
  assert(!state.player.purchases.some(item => item.id === 'crime-gloves'), 'Selling removes tool ownership');
  $('close-life-profile').click();
  $('activities').click(); $('activity-crime').click();
  assert($('crime-dialog').querySelector('button').disabled, 'Selling tool locks the crime again');
  result.textContent = 'PASS: tool shopping; age limit; cancel/confirm; saved ownership; reusable tools; inventory/selling; crime UI; arrest; saved sentence; activity restrictions; prison priority at age 25; release';
} catch (error) { result.textContent = 'FAIL: ' + error.stack; }
finally { keys.forEach((key, index) => saved[index] === null ? localStorage.removeItem(key) : localStorage.setItem(key, saved[index])); }
</script>
