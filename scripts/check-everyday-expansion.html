<!doctype html><meta charset="utf-8"><title>Everyday events and media audit</title>
<pre id="expansion-result">Running…</pre>
<script>
(async()=>{
  const result=document.getElementById('expansion-result');
  const assert=(value,message)=>{if(!value)throw Error(message);};
  const keys=['lifeAgainSave','lifeAgainAchievements','lifeAgainAchievementQueue'];
  const backup=keys.map(key=>localStorage.getItem(key)),random=Math.random;
  try{
    const {getAgeEvents,getBaseAgeEvents}=await import('../js/events.js');
    const {createEverydayAdditions}=await import('../js/everyday-additions.js');
    const {reviewEventMedia}=await import('../js/semantic-event-media.js');
    const {getEventOpenMoji}=await import('../js/event-openmoji.js');
    const {createEventImageRenderer}=await import('../js/event-image.js');
    const {state,createInitialState}=await import('../js/state.js');
    const {achievements}=await import('../js/achievements-data.js');
    const {getCareerProfile}=await import('../js/career-jobs.js');
    const ids=new Set(),titles=new Set(),assets=new Set();let total=0;
    for(let age=1;age<=105;age++){
      const pool=getAgeEvents(age),extra=pool.filter(e=>e.addedEveryday);
      const expected = age === 24 ? 0 : 2;
      assert(extra.length===expected&&pool.length===(getBaseAgeEvents(age)?.length??0)+expected,'Ordinary additions except the orientation-only age 24 at '+age);
      for(const event of extra){
        assert(!ids.has(event.id)&&!titles.has(event.title),'Distinct authored situations');ids.add(event.id);titles.add(event.title);
        assert(event.choices.length===2&&event.text&&!event.specialId,'Ordinary event with two actions');
        for(const slot of [event,...event.choices]){
          assert(slot.image&&slot.imageFallback&&slot.imageAlt&&slot.imageFallbackAlt,'Every scene and outcome has media');assets.add(slot.image);assets.add(slot.imageFallback);
        }
        for(const choice of event.choices)assert(!choice.death&&!choice.nextStep&&Object.values(choice.effects).some(value=>value!==0),'Ordinary choices have effects and preserve special mechanics');
        total++;
      }
    }
    assert(total===208,'All 208 active new events');
    const audit=await(await fetch('../js/img/events/full-media-audit.json')).json();
    assert(audit.length>3000&&new Set(audit.map(row=>row.age)).size===105,'Whole-life and career branch audit exists');
    for(const row of audit){assets.add(new URL('../'+row.image,location.href).href);assets.add(new URL('../'+row.fallback,location.href).href);assert(row.kind==='animated-openmoji','Every slot uses animated OpenMoji');}
    await Promise.all([...assets].map(async url=>assert((await fetch(url)).ok,'Asset exists '+url)));
    const illustration=getEventOpenMoji(getAgeEvents(13).find(event=>event.id==='teen-13-2'),{},false);
    const image={dataset:{},style:{},removeAttribute(){},offsetWidth:0};
    const render=createEventImageRenderer(image,{matches:false});
    for(let i=0;i<20;i++){render(illustration.url,illustration.alt,illustration.poster,illustration.alt,[illustration]);image.onload();}
    assert(image.src===illustration.url&&!image.hidden,'Exact animation can repeat without a cap');
    const parsed=new DOMParser().parseFromString(await(await fetch('../index.html')).text(),'text/html');
    parsed.querySelectorAll('script').forEach(e=>e.remove());parsed.querySelectorAll('[src]').forEach(e=>e.removeAttribute('src'));
    document.body.insertAdjacentHTML('beforeend',parsed.body.innerHTML);
    Object.assign(state,createInitialState());localStorage.removeItem('lifeAgainSave');
    localStorage.setItem('lifeAgainAchievements',JSON.stringify(Object.fromEntries(achievements.map(e=>[e.id,true]))));localStorage.setItem('lifeAgainAchievementQueue','[]');
    await import('../js/main.js');
    const birthday=document.getElementById('age-up'),confirm=document.getElementById('event-confirm');
    const choose=i=>{if(state.pendingEvent?.mediaTransition&&state.pendingEvent?.nextScene)confirm.click();const button=document.querySelectorAll('#event-choices button')[i];assert(button,'Choice exists '+i);button.click();};
    const restore=()=>{const saved=JSON.parse(localStorage.getItem('lifeAgainSave'));state.pendingEvent=saved.pendingEvent;state.followUpEvent=saved.followUpEvent;};
    const reset=(age,extra={})=>{
      document.querySelectorAll('dialog[open]').forEach(d=>d.close());Object.assign(state,createInitialState());
      Object.assign(state.player,{age:age-1,health:60,intelligence:50,happiness:50,appearance:50,studyBlock:'A00',datingActivitiesOnly:true,employmentStatus:'declined',nextPromotionAge:null},extra);
      birthday.disabled=false;document.getElementById('game-screen').hidden=false;
    };
    for(let age=1;age<=105;age++)for(let i=0;i<2;i++)for(let action=0;action<2;action++){
      if ([18, 24, 25, 105].includes(age)) continue;
      reset(age);const pool=getAgeEvents(age),index=pool.findIndex(e=>e.id==='everyday-added-'+age+'-'+(i+1));
      let rolls=[...(age>=98?[0.1]:[]),0.1,(index+0.1)/pool.length];
      Math.random=()=>rolls.shift()??0.1;birthday.click();Math.random=()=>0.99;
      assert(state.pendingEvent?.id==='everyday-added-'+age+'-'+(i+1)||state.pendingEvent?.title===createEverydayAdditions(age)[i].title,'Every new event is reachable at '+age+' #'+i);
      choose(action);restore();assert(state.pendingEvent.stage==='result'&&state.player.age===age-1,'Saved selection waits for confirmation');
      confirm.click();
      assert(state.player.age===age&&!state.pendingEvent&&!state.followUpEvent,'One birthday completed after all scenes '+age);
      if(age!==105)assert(state.player.isAlive,'Every ordinary outcome survives');
      for(const stat of ['health','intelligence','happiness','appearance'])assert(state.player[stat]>=0&&state.player[stat]<=100,'Stat bounds');
      const saved=JSON.parse(localStorage.getItem('lifeAgainSave'));assert(saved.player.age===age&&!saved.pendingEvent,'Year completion persists');
    }
    reset(25,{datingActivitiesOnly:false,careerPath:{id:'programming'},employmentStatus:'employed',careerLevel:1,job:getCareerProfile('programming').ranks[0],lastSalaryAge:24});
    Math.random=()=>0.1;birthday.click();assert(state.pendingEvent.kind==='workplace-dating'&&!state.followUpEvent,'Age-25 dating is the only story');
    choose(0);restore();confirm.click();assert(state.player.partner&&state.player.age===25&&state.player.money===120000000&&!state.pendingEvent,'Dating settles the birthday and pays salary once');
    confirm.click();assert(state.player.money===120000000,'Repeated confirmation cannot pay twice');
    reset(105);Math.random=()=>0.1;birthday.click();assert(state.pendingEvent.specialId==='later-105'&&!state.followUpEvent,'Age-105 finale starts directly');
    for(let n=0;n<4;n++)choose(0);restore();confirm.click();assert(state.player.isAlive===false&&state.player.ending==='fulfilled','Finale still ends at 105');
    result.textContent='PASS: ordinary actions outside mandatory milestones, one story per birthday, complete OpenMoji audit, saved progress, direct age-105 finale and salary once per year.';
  }catch(error){result.textContent='FAIL: '+error.stack;}
  finally{Math.random=random;keys.forEach((key,i)=>backup[i]===null?localStorage.removeItem(key):localStorage.setItem(key,backup[i]));}
})();
</script>
