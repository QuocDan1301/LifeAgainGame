<!doctype html>
<meta charset="utf-8">
<title>Hospital checks</title>
<pre id="hospital-check-result">Running…</pre>
<script>
(async () => {
  const result = document.getElementById("hospital-check-result");
  const assert = (condition, message) => { if (!condition) throw new Error(message); };
  const keys = ["lifeAgainSave", "lifeAgainAchievements", "lifeAgainAchievementQueue"];
  const saved = keys.map(key => localStorage.getItem(key));
  const random = Math.random;
  try {
    const { createInitialState, state } = await import("../js/core/state.js");
    const { diseases, planIllnesses, collectIllnessYear, getIllnessStage, getTreatmentCost, getIllnessOutlook, getDisease } =
      await import("../js/stats/hospital.js");
    const { EMERGENCY } = await import("../js/stats/health-rules.js");
    assert(diseases.length === 10 && new Set(diseases.map(d => d.id)).size === 10 && diseases.every(d => d.cost > 0), "Ten diseases with fees");
    assert(diseases.every(d => d.severeAfter < d.criticalAfter && d.loss.length === 3 && d.criticalRisk > 0), "Each disease has its own stage config");
    assert(new Set(diseases.map(d => d.criticalAfter)).size > 1, "No single fatal deadline for every disease");
    // Lịch bệnh: 0–2 bệnh khác nhau, tuổi 18–95.
    const counts = new Set();
    for (let i = 0; i < 300; i++) {
      const plan = planIllnesses({ age: 0 });
      counts.add(plan.length);
      assert(plan.length <= 2 && new Set(plan.map(p => p.id)).size === plan.length, "At most two different diseases");
      assert(plan.every(p => p.age >= 18 && p.age <= 95), "Diseases appear between 18 and 95");
      assert(plan.every(p => !["coronary", "early-cancer"].includes(p.id) || p.age >= 40), "Costly diseases only from 40");
    }
    assert([0, 1, 2].every(n => counts.has(n)), "A life can have 0, 1 or 2 diseases");
    assert(planIllnesses({ age: 60 }).every(p => p.age > 60), "Old saves only schedule future diseases");
    const fixed = { age: 5, illnessPlan: [{ id: "gout", age: 30 }] };
    assert(planIllnesses(fixed) === fixed.illnessPlan, "The plan is made once per life");
    // Chẩn đoán, tiến triển Nhẹ → Nặng → Nguy kịch theo cấu hình riêng của Gout (Nặng sau 3 năm, Nguy kịch sau 8 năm).
    const lucky = () => 0.99;
    const sick = { age: 29, health: 80, money: 0, isAlive: true, illnessPlan: [{ id: "gout", age: 30 }] };
    assert(collectIllnessYear(sick, 29) === null, "Nothing before the scheduled age");
    assert(collectIllnessYear(sick, 30).content.includes("chẩn đoán") && sick.illnesses.length === 1 && sick.health === 80,
      "Diagnosis at the scheduled age without an immediate penalty");
    for (let age = 31; age <= 37; age++) collectIllnessYear(sick, age, lucky);
    assert(sick.health === 80 - 2 * 1 - 5 * 2 && sick.isAlive, "Gout: -1 while mild (2 years), -2 while severe (5 years)");
    assert(collectIllnessYear(sick, 38, lucky).content.includes("Nguy kịch") && sick.isAlive, "Gout turns critical after 8 years");
    collectIllnessYear(sick, 39, () => 0);
    assert(sick.isAlive === false && sick.deathCause === "gout", "Only the critical stage carries a death risk");
    assert(getIllnessStage({ id: "pneumonia", since: 30 }, 32, 80) === "critical" && getIllnessStage({ id: "gout", since: 30 }, 32, 80) === "mild",
      "Acute diseases progress faster than chronic ones");
    // Sức khỏe thấp làm bệnh tiến triển nhanh hơn và tăng nguy cơ.
    assert(getIllnessStage({ id: "gout", since: 30 }, 31, 80) === "mild" && getIllnessStage({ id: "gout", since: 30 }, 31, 10) === "severe",
      "Low health makes the disease progress faster");
    const strong = getIllnessOutlook({ age: 40, health: 90 }, { id: "coronary", since: 36 });
    const weak = getIllnessOutlook({ age: 40, health: 30 }, { id: "coronary", since: 36 });
    assert(strong.stage === "critical" && weak.deathChance > strong.deathChance, "Low health raises the critical-stage risk");
    // Điều trị sớm rẻ hơn.
    const gout = getDisease("gout");
    assert(getTreatmentCost(gout, "mild") === 10_000_000 && getTreatmentCost(gout, "severe") === 15_000_000 &&
      getTreatmentCost(gout, "critical") === 20_000_000, "Treatment costs more at later stages");
    // Nghỉ dưỡng giảm hao sức nhưng không chữa bệnh.
    const resting = getIllnessOutlook({ age: 40, health: 80, restYear: 41 }, { id: "diabetes", since: 37 });
    const working = getIllnessOutlook({ age: 40, health: 80 }, { id: "diabetes", since: 37 });
    assert(resting.loss < working.loss && resting.stage === working.stage, "Rest halves the health loss but not the stage");
    // Sức khỏe cạn khi bệnh chưa nguy kịch: cấp cứu, không tử vong.
    const frail = { age: 50, health: 1, money: 0, isAlive: true, illnessPlan: [], illnesses: [{ id: "gout", since: 49 }] };
    assert(collectIllnessYear(frail, 50, lucky).content.includes("cấp cứu") && frail.isAlive && frail.health === EMERGENCY.healthAfter &&
      frail.money === -EMERGENCY.cost, "Running out of health before the critical stage means an emergency, not death");

    const html = await (await fetch("../index.html")).text();
    const parsed = new DOMParser().parseFromString(html, "text/html");
    parsed.querySelectorAll("script").forEach(element => element.remove());
    parsed.querySelectorAll("[src]").forEach(element => element.removeAttribute("src"));
    document.body.insertAdjacentHTML("beforeend", parsed.body.innerHTML);
    localStorage.setItem("lifeAgainAchievements", "{}");
    localStorage.setItem("lifeAgainAchievementQueue", "[]");
    document.getElementById("game-screen").hidden = false;
    document.getElementById("lobby-screen").hidden = true;
    Object.assign(state, createInitialState());
    Object.assign(state.player, { name: "Test", gender: "male", age: 40, health: 80, happiness: 50, intelligence: 50,
      appearance: 50, money: 20_000_000, studyBlock: "A00", datingActivitiesOnly: true, employmentStatus: "declined",
      nextPromotionAge: null, illnessPlan: [], illnesses: [{ id: "gout", since: 38 }, { id: "early-cancer", since: 40 }] });
    Math.random = () => 0.99;
    await import("../js/main.js");
    const $ = id => document.getElementById(id);
    const treatButton = id => $("hospital-body").querySelector(`.shop-buy[data-disease="${id}"]`);
    // Thẻ bệnh trên màn hình chính.
    assert(!$("health-alert").hidden && $("health-alert").textContent.includes("Gout") && $("health-alert").textContent.includes("Năm tới"),
      "Visible illness card with next-year risk");
    $("activities").click();
    $("activity-hospital").click();
    assert($("hospital-dialog").open && $("hospital-body").querySelectorAll(".hospital-prices li").length === 10, "Hospital shows the fee table");
    assert($("hospital-body").textContent.includes("Nhẹ") && $("hospital-body").textContent.includes("Năm tới"), "Stage and risk are shown");
    assert(treatButton("early-cancer").disabled && !treatButton("gout").disabled, "Treatment needs enough money");
    treatButton("gout").click();
    assert($("shop-confirm-dialog").open, "Treatment asks for confirmation");
    $("shop-confirm").click();
    assert(state.player.illnesses.length === 1 && state.player.money === 10_000_000, "Treatment cures and charges the fee");
    assert(state.logs.at(-1).content.includes("Điều trị khỏi"), "Treatment is recorded");
    $("close-hospital").click();
    // Bệnh nguy kịch: cảnh báo trước sinh nhật, người chơi chọn tiếp tục bỏ qua và gặp rủi ro.
    state.player.illnesses = [{ id: "early-cancer", since: 31 }];
    $("age-up").click();
    assert($("health-check-dialog").open && $("health-check-body").textContent.includes("Ung thư") &&
      $("health-check-body").textContent.includes("nguy cơ tử vong") && state.player.age === 40, "Warns before the birthday instead of only logging");
    Math.random = () => 0;
    [...$("health-check-body").querySelectorAll("button")].find(b => b.textContent.includes("Vẫn tiếp tục")).click();
    if (state.pendingEvent) {
      document.querySelector("#event-choices button")?.click();
      $("event-confirm").click();
    }
    assert(state.player.isAlive === false && $("death-dialog").open && $("age-up").disabled, "Ignoring a critical disease can end the game");
    assert(state.logs.some(log => log.content.includes("ở mức Nguy kịch")), "Death cause is in the diary");
    const deathIndex = state.logs.findIndex(log => log.content.includes("💀"));
    assert(!state.logs[deathIndex].content.split("💀")[1].includes("Chi phí sinh hoạt"), "No living costs after the death line");
    result.textContent = "PASS: 10 diseases with own stage configs; diagnosis; mild/severe/critical; low health speeds up; cost by stage; rest; emergency; visible card; warning before the birthday; death only when critical";
  } catch (error) {
    result.textContent = `FAIL: ${error.stack}`;
  } finally {
    Math.random = random;
    keys.forEach((key, index) => saved[index] === null ? localStorage.removeItem(key) : localStorage.setItem(key, saved[index]));
  }
})();
</script>
