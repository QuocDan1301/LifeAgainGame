<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../css/style.css"><title>Tower UI checks</title><pre id="result">Running…</pre>
<script type="module">
const assert = (value, message) => { if (!value) throw new Error(message); };
const previousSave = localStorage.getItem('lifeAgainSave');
try {
  const parsed = new DOMParser().parseFromString(await (await fetch('../index.html')).text(), 'text/html');
  parsed.querySelectorAll('script').forEach(el => el.remove()); parsed.querySelectorAll('[src]').forEach(el => el.removeAttribute('src'));
  document.body.insertAdjacentHTML('beforeend', parsed.body.innerHTML);
  const { createInitialState } = await import('../js/core/state.js');
  const { initGames, payout, TOWER_MULTIPLIERS } = await import('../js/leisure/games.js');
  const state = createInitialState(); Object.assign(state.player, { age: 30, money: 10_000_000 });
  state.player.gameRound = { game: 'tower', bet: 100_000, choice: 'climb', safeDoors: [0, 0, 0, 0, 0], floor: 0, phase: 'choose' };
  initGames(state, { renderMoney() {}, renderLogEntry() {} });
  const open = () => { document.querySelectorAll('dialog[open]').forEach(el => el.close()); document.getElementById('activity-games').click(); document.getElementById('confirm-games-notice').click(); };
  open();
  assert(document.querySelectorAll('.game-floor').length === 5, 'Five monetary milestones');
  assert(document.querySelector('[aria-label="Mở cửa trái"]'), 'Door has accessible name');
  document.querySelector('[aria-label="Mở cửa trái"]').click();
  assert([...document.querySelectorAll('.game-door')].every(el => el.disabled), 'Both doors disabled during reveal');
  assert(state.player.gameRound.phase === 'reveal' && state.player.gameRound.selectedDoor === 0, 'Chosen door is committed immediately');
  const savedReveal = JSON.parse(localStorage.getItem('lifeAgainSave')).player.gameRound;
  assert(savedReveal.phase === 'reveal' && savedReveal.selectedDoor === 0, 'Reload preserves the exact chosen door');
  open();
  assert(!document.querySelector('.game-door:not(:disabled)'), 'Reopening cannot select another door during reveal');
  assert(!document.querySelector('.game-tower-stop') && !document.querySelector('.game-tower-next'), 'Reveal cannot cash out an uncleared floor or advance again');
  state.player.gameRound = savedReveal; // Simulate a saved-round reload before the timer fires.
  open();
  await new Promise(resolve => setTimeout(resolve, 750));
  assert(state.player.gameRound.floor === 1 && document.querySelector('.game-tower-stop').textContent.includes('190k'), 'Cash-out amount matches cleared floor');
  assert(document.querySelector('.game-tower-next').textContent.includes('380k'), 'Next-floor target is visible');
  document.querySelector('.game-tower-next').click();
  document.querySelector('[aria-label="Mở cửa phải"]').click();
  const beforeLoss = state.player.money;
  open(); open();
  await new Promise(resolve => setTimeout(resolve, 750));
  assert(state.player.gameRound === null && state.player.money === beforeLoss, 'Losing reveal settles without a refund');
  assert(state.player.gamblingLosses === 100_000, 'Repeated reopen records one loss');
  const logCount = state.logs.length;
  await new Promise(resolve => setTimeout(resolve, 750));
  assert(state.logs.length === logCount, 'Stale timers do not settle a second time');
  state.player.gameRound = { game: 'tower', bet: 100_000, floor: 4, phase: 'choose', safeDoors: [0, 0, 0, 0, 0] };
  open();
  const beforeWin = state.player.money;
  document.querySelector('[aria-label="Mở cửa trái"]').click();
  open(); open();
  await new Promise(resolve => setTimeout(resolve, 750));
  assert(state.player.money === beforeWin + payout(100_000, TOWER_MULTIPLIERS[4]), 'Final-floor win pays exactly once across repeated reopening');
  assert(state.player.gameRound === null && state.logs.length === logCount + 1, 'Winning reveal is settled once');
  // Keep the original floor-one view available to the responsive screenshot runner.
  state.player.gameRound = { game: 'tower', bet: 100_000, floor: 1, phase: 'decide', safeDoors: [0, 0, 0, 0, 0] };
  (await import('../js/core/save-store.js')).saveGame(state);
  open();
  window.towerTest = { state, open };
  document.getElementById('result').textContent = 'PASS tower UI: five milestones; named doors; reveal lock; current floor; accurate cash-out and next-floor amounts; saved door, reload, stale-timer rejection and single settlement';
} catch (error) { document.getElementById('result').textContent = 'FAIL: ' + error.stack; }
finally { if (previousSave === null) localStorage.removeItem('lifeAgainSave'); else localStorage.setItem('lifeAgainSave', previousSave); }
</script>
