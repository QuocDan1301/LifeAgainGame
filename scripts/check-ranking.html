<!doctype html>
<meta charset="utf-8">
<title>Ranking UI checks</title>
<link rel="stylesheet" href="../css/ranking.css">
<pre id="result">Running…</pre>
<script type="module">
const result = document.getElementById('result');
const assert = (condition, message) => { if (!condition) throw new Error(message); };
const wait = async condition => { for (let i = 0; i < 100; i++) { if (condition()) return; await new Promise(resolve => setTimeout(resolve, 50)); } throw new Error('Timed out waiting for UI'); };
try {
  const scenario = new URLSearchParams(location.search);
  const username = scenario.get('user') ?? 'uitester';
  const nickname = scenario.get('name') ?? '<img src=x> An';
  const lifespan = Number(scenario.get('age') ?? 80);
  const happiness = Number(scenario.get('happiness') ?? 70);
  const expectedRows = Number(scenario.get('rows') ?? 1);
  const html = await (await fetch('../index.html')).text();
  const parsed = new DOMParser().parseFromString(html, 'text/html');
  parsed.querySelectorAll('script').forEach(element => element.remove());
  parsed.querySelectorAll('[src]').forEach(element => element.removeAttribute('src'));
  document.body.insertAdjacentHTML('beforeend', parsed.body.innerHTML);
  const { initRankingUI } = await import('../js/ranking/ranking-ui.js');
  initRankingUI();
  document.querySelector('.lobby-actions .ranking-account-open').click();
  await wait(() => document.querySelector('.ranking-form'));
  assert(document.getElementById('ranking-board').hidden, 'Profile does not show global leaderboard');
  assert(document.getElementById('ranking-title').textContent.includes('Hồ sơ'), 'Profile has its own title');
  [...document.querySelectorAll('#ranking-account > .ranking-actions button')].find(button => button.textContent === 'Đăng nhập').click();
  assert(getComputedStyle(document.querySelector('.ranking-form [name=confirmation]').parentElement).display === 'none', 'Login hides registration fields');
  [...document.querySelectorAll('#ranking-account > .ranking-actions button')].find(button => button.textContent === 'Tạo tài khoản').click();
  const form = document.querySelector('.ranking-form');
  form.elements.username.value = username; form.elements.password.value = 'test-password'; form.elements.confirmation.value = 'test-password'; form.elements.nickname.value = nickname;
  [...form.querySelectorAll('button')].find(button => button.textContent === 'Tạo tài khoản').click();
  await wait(() => document.querySelector('.ranking-profile'));
  assert(document.querySelector('.ranking-profile').textContent.includes(nickname), 'Nickname is visible as plain text');
  assert(!document.querySelector('#ranking-account img'), 'Nickname cannot inject HTML');
  assert(document.querySelector('.lobby-actions .ranking-account-open').textContent.includes(nickname), 'Lobby identifies signed-in player');
  document.getElementById('ranking-dialog').close();
  const { state, createInitialState } = await import('../js/core/state.js');
  Object.assign(state, createInitialState());
  Object.assign(state.player, { name: nickname, health: 80, happiness, intelligence: 60, appearance: 60, money: 100_000_000, relatives: [], illnessPlan: [] });
  document.getElementById('game-screen').hidden = false; document.getElementById('lobby-screen').hidden = true;
  await import('../js/main.js');
  await wait(() => state.player.ranking.serverRunId);
  const { observeRanking } = await import('../js/ranking/scoring.js');
  for (let age = 0; age <= lifespan; age++) { state.player.age = age; observeRanking(state); }
  state.player.isAlive = false;
  document.dispatchEvent(new Event('ranking-life-ended'));
  await wait(() => JSON.parse(localStorage.getItem('lifeAgainRankingHistory') ?? '[]')[0]?.submitted);
  assert(document.getElementById('ranking-life-score').textContent.includes('/1.000'), 'Score appears in life summary');
  document.dispatchEvent(new Event('ranking-life-ended'));
  assert(JSON.parse(localStorage.getItem('lifeAgainRankingHistory')).length === 1, 'Completion is idempotent');
  document.querySelector('.lobby-actions .ranking-open').click();
  await wait(() => document.querySelector('.ranking-table'));
  assert(document.querySelector('.ranking-table tbody').children.length === expectedRows, 'Board contains real accounts');
  assert(document.querySelector('.ranking-position').textContent.includes('#1'), 'Own rank visible');
  assert(document.getElementById('ranking-account').hidden && document.getElementById('ranking-history').hidden, 'Leaderboard hides account form and personal history');
  document.querySelector('.ranking-switch-view').click();
  await wait(() => !document.getElementById('ranking-history').hidden);
  assert(document.querySelector('#ranking-history details'), 'Local run and breakdown visible in profile');
  assert(document.getElementById('ranking-dialog').scrollWidth <= document.getElementById('ranking-dialog').clientWidth, 'Dialog fits mobile width');
  result.textContent = 'PASS ranking UI: registration; safe nickname; newborn registration; completion score; upload; duplicate prevention; real board; own rank; history; mobile width';
} catch (error) { result.textContent = 'FAIL: ' + error.stack; }
</script>
