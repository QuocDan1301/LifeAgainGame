<!doctype html>
<meta charset="utf-8">
<title>Appearance mechanic checks</title>
<pre id="appearance-check-result">Running…</pre>
<script>
(async () => {
  const result = document.getElementById("appearance-check-result");
  const assert = (condition, message) => { if (!condition) throw new Error(message); };
  const keys = ["lifeAgainSave", "lifeAgainAchievements", "lifeAgainAchievementQueue"];
  const saved = keys.map(key => localStorage.getItem(key));
  const random = Math.random;
  try {
    const { createInitialState, state } = await import("../js/state.js");
    const A = await import("../js/appearance-rules.js");
    const { createAcquaintanceEvent } = await import("../js/acquaintance.js");
    const I = await import("../js/intellect-rules.js");
    const near = (a, b) => Math.abs(a - b) < 1e-9;

    // 2. Cơ hội làm quen: 15% + (NH − 50) × 0,2 + 10% giao tiếp, 5–35%.
    const chance = (appearance, social = false) => A.getAcquaintanceChance({ appearance, developmentDone: {}, reachOutAge: social ? 29 : null }, 30);
    assert(near(chance(20), 0.09) && near(chance(80), 0.21), "Examples: 9% at 20, 21% at 80");
    assert(near(chance(50, true), 0.25) && near(chance(100, true), 0.35) && near(chance(0), 0.05), "Social bonus +10, bounds 5–35%");
    assert(A.getSocialContext({ employmentStatus: "employed" }, 30) === "work" && A.getSocialContext({ developmentDone: {} }, 15) === "school" &&
      A.getSocialContext({ developmentDone: {}, employmentStatus: "unemployed" }, 35) === null, "Only years with a social setting");
    const teen = createAcquaintanceEvent({ age: 14, appearance: 50, gender: "female", developmentDone: {} }, 15, () => 0);
    assert(teen && !teen.choices.some(c => c.playerUpdates?.partner) && teen.choices.some(c => c.playerUpdates?.friends), "Teens: friendship only");
    const adult = extra => ({ age: 29, appearance: 50, gender: "male", orientation: "homosexual", employmentStatus: "employed",
      careerPath: { id: "law" }, developmentDone: {}, ...extra });
    const romance = createAcquaintanceEvent(adult(), 30, () => 0);
    const date = romance.choices.find(c => c.playerUpdates?.partner);
    assert(date && date.playerUpdates.partner.gender === "male", "Romance respects orientation");
    assert(romance.choices.some(c => c.playerUpdates?.friends) && romance.choices.some(c => c.title.includes("lời chào")), "Friendship and a polite no are always there");
    assert(!createAcquaintanceEvent(adult({ partner: { id: "x" } }), 30, () => 0).choices.some(c => c.playerUpdates?.partner), "No romance offer while in a relationship");
    // 3. Ấn tượng ban đầu chỉ là lợi thế nhỏ.
    assert(A.getRomanceChance({ appearance: 100 }) <= 0.75 && A.getRomanceChance({ appearance: 0 }) >= 0.35, "Looks never guarantee or doom a date");
    assert(Math.abs(A.getStartingBond({ appearance: 100 }) - A.getStartingBond({ appearance: 0 })) <= 6, "Starting bond differs by at most ±3");
    let first = true;
    const declined = createAcquaintanceEvent(adult({ appearance: 100 }), 30, () => (first ? ((first = false), 0) : 0.99));
    assert(declined.choices.some(c => c.title.includes("Làm bạn trước")), "A refusal is respected even at high appearance");

    // 4. Nghề hình ảnh: điểm cộng nhỏ; nghề khác không có.
    const looks = (careerId, appearance) => I.getInterviewChance({ intelligence: 50, appearance }, "good", careerId).chance;
    assert(looks("acting", 90) > looks("acting", 50) && looks("acting", 90) - looks("acting", 50) <= 0.04 + 1e-9, "Small appearance bonus for acting");
    assert(looks("programming", 90) === looks("programming", 50) && looks("mechanical", 10) === looks("mechanical", 50), "No appearance bonus for IT or mechanics");
    const castingChance = (prep, appearance = 50, weight = 1) => A.getCastingChance({ appearance, employedSince: 25 }, 30, prep, weight);
    assert(castingChance("practice") >= castingChance("pro") - 0.02 && castingChance("current") >= 0.5, "The priciest option is not clearly best; current style still works");
    assert(castingChance("current", 100, 0) === castingChance("current", 0, 0), "Some roles do not depend on looks");
    assert(!A.createCastingEvent({ employmentStatus: "employed", careerPath: { id: "accounting" } }, 30, () => 0), "No castings for non-image careers");
    const casting = A.createCastingEvent({ employmentStatus: "employed", careerPath: { id: "acting" }, employedSince: 25, money: 100, appearance: 50 }, 30, () => 0);
    assert(casting.choices.every(c => !c.label.includes("chuyên nghiệp")) && casting.choices.length >= 2, "Unaffordable paid prep is not offered; free options remain");
    assert(!Object.values(A.OCCASION_PREP).some(p => p.appearance), "Occasion prep never adds permanent appearance");

    // 6. Tuổi tác: biến động nhẹ, chăm sóc giữ phong cách; không trừ vì sức khỏe hay hạnh phúc.
    assert(!A.collectAppearanceYear({ age: 50, appearance: 60 }, 51, () => 0), "No change before 60");
    assert(A.collectAppearanceYear({ age: 70, appearance: 60, developmentDone: {} }, 71, () => 0)?.content.includes("-1"), "Mild change in old age");
    assert(!A.collectAppearanceYear({ age: 70, appearance: 60, developmentDone: { "home-care": 70 } }, 71, () => 0), "Self-care keeps the style");
    assert(!A.collectAppearanceYear({ age: 70, appearance: 60, developmentDone: {} }, 71, () => 0.5), "Not everyone changes");

    // Giao diện.
    const html = await (await fetch("../index.html")).text();
    const parsed = new DOMParser().parseFromString(html, "text/html");
    parsed.querySelectorAll("script").forEach(element => element.remove());
    parsed.querySelectorAll("[src]").forEach(element => element.removeAttribute("src"));
    document.body.insertAdjacentHTML("beforeend", parsed.body.innerHTML);
    localStorage.setItem("lifeAgainAchievements", "{}");
    localStorage.setItem("lifeAgainAchievementQueue", "[]");
    document.getElementById("game-screen").hidden = false;
    document.getElementById("lobby-screen").hidden = true;
    Object.assign(state, createInitialState());
    Object.assign(state.player, { name: "Test", gender: "female", orientation: "heterosexual", age: 31, health: 80, happiness: 60, intelligence: 50,
      appearance: 30, money: 0, studyBlock: "A00", illnessPlan: [], relatives: [], employmentStatus: "declined", healthCheckAge: 31, datingActivitiesOnly: false });
    Math.random = () => 0.5;
    await import("../js/main.js");
    const $ = id => document.getElementById(id);
    const closeAll = () => document.querySelectorAll("dialog[open]").forEach(d => d.close());
    closeAll();
    // Chủ động kết nối: miễn phí, mỗi năm một lần, tạo bối cảnh giao tiếp.
    $("relationships").click();
    const reach = () => $("relationship-family").querySelector('[data-action="reach-out"]');
    reach().click();
    assert(state.player.reachOutAge === 31 && state.player.happiness === 61 && reach().disabled, "Reaching out is free and once per year");
    closeAll();
    // Năm sau: lời làm quen thay cho chuyện đời thường (ngoại hình thấp vẫn có cơ hội).
    Math.random = () => 0;
    $("age-up").click();
    assert(state.pendingEvent?.kind === "acquaintance", "An acquaintance appears in an ordinary year");
    [...$("event-choices").querySelectorAll("button")].find(b => b.textContent.includes("làm bạn")).click();
    $("event-confirm").click();
    assert(state.player.friends?.length === 1 && state.player.age === 32, "Friendship is recorded");
    // Chăm sóc cá nhân miễn phí và học phong cách (mở lựa chọn chuẩn bị theo phong cách riêng).
    closeAll();
    Object.assign(state.player, { money: 0, appearance: 99, developmentDone: {} });
    $("activities").click();
    $("activity-self-development").click();
    $("self-development-body").querySelector('.shop-group[data-stat="appearance"]').click();
    const free = id => $("self-development-body").querySelector(`.dev-recover[data-activity="${id}"]`);
    assert(free("home-care") && free("outfit") && free("style-lesson"), "Free personal care and style lesson");
    assert($("self-development-body").textContent.includes("chạm mức 100"), "Real gain near 100 is shown before paying");
    free("style-lesson").click();
    assert(state.player.styleSkill === true && state.player.appearance === 100, "Style lesson learned once");
    assert(A.createCastingEvent({ employmentStatus: "employed", careerPath: { id: "fashion" }, employedSince: 25, money: 0, appearance: 50, styleSkill: true }, 30, () => 0)
      .choices.some(c => c.label.includes("phong cách riêng")), "Style skill unlocks a free preparation option");
    result.textContent = "PASS: acquaintance 15% + (looks−50)×0.2 + 10% social, 5–35%, social settings only, friendship or romance by age and orientation, refusals respected; small first-impression edge; small casting/interview edge only for image careers; prep options with trade-offs, no permanent gains; mild avoidable ageing; free reach-out, personal care and style lesson; real gains shown before paying";
  } catch (error) {
    result.textContent = `FAIL: ${error.stack}`;
  } finally {
    Math.random = random;
    keys.forEach((key, index) => saved[index] === null ? localStorage.removeItem(key) : localStorage.setItem(key, saved[index]));
  }
})();
</script>
