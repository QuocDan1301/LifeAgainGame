<!doctype html><meta charset="utf-8"><title>Family checks</title>
<pre id="family-check-result">Running…</pre>
<script>
(async () => {
  const result = document.getElementById('family-check-result');
  const assert = (value, message) => { if (!value) throw Error(message); };
  const keys = ['lifeAgainSave','lifeAgainAchievements','lifeAgainAchievementQueue'];
  const previous = keys.map(key => localStorage.getItem(key));
  const random = Math.random;
  try {
    const {state,createInitialState} = await import('../js/core/state.js');
    const {createAdmirer,getDatingUpdates,getMarriageUpdates,getBreakupUpdates,canStartRelationship,createDatingEvent} = await import('../js/relationships/relationships.js');
    const {createChildProposalEvent,getChildProposalUpdates,getAnnualChildcareCost,getChildcareExpenses,completeLifeYear,getChildAge,migrateChildcareDebt} = await import('../js/relationships/family.js');
    Math.random = () => 0.99;
    const base = () => ({...createInitialState().player, age:34, gender:'male', health:90,
      happiness:70, intelligence:70, appearance:70, studyBlock:'A', money:1_000_000_000});
    const person = createAdmirer({...base(),orientation:'heterosexual'},25,()=>0.4);
    const married = () => ({...base(),partner:person,marriedAtAge:30,nextChildProposalAge:35});
    assert(!createChildProposalEvent(married(),34) && createChildProposalEvent(married(),35), 'Ask five years after marriage');
    assert(createChildProposalEvent(married(),35).title.includes('sinh con'), 'Different-gender spouses discuss birth');
    const sameGender = {...married(),gender:person.gender,orientation:'bisexual'};
    assert(createChildProposalEvent(sameGender,35).title.includes('nhận con nuôi'), 'Same-gender spouses discuss adoption regardless of orientation');
    assert(createChildProposalEvent(married(),35).choices[0].achievementIds.includes('first-child'), 'Birth/adoption unlocks the parenthood achievement');
    const declined = married();
    Object.assign(declined,getChildProposalUpdates(declined,person,35,'decline'));
    assert(declined.nextChildProposalAge===37 && !createChildProposalEvent(declined,36), 'First refusal retries in two years');
    const restored = JSON.parse(JSON.stringify(declined));
    assert(createChildProposalEvent(restored,37), 'Retry persists across reload');
    Object.assign(restored,getChildProposalUpdates(restored,person,37,'decline'));
    assert(restored.partner && restored.childProposalStopped && !createChildProposalEvent(restored,50), 'Second refusal stops requests without ending the marriage');
    assert(restored.partner.stats.happiness===Math.max(0,person.stats.happiness-5),'Second refusal makes the spouse sad');
    const parents = married();
    Object.assign(parents,getChildProposalUpdates(parents,person,35,'accept',()=>0.4));
    assert(!createChildProposalEvent(parents,39) && createChildProposalEvent(parents,40).id.endsWith('-child-2'), 'Spouse asks about a second child five years after the first');
    assert(createChildProposalEvent(parents,40).choices.map(c=>c.childDecision).join()==='birth,adopt,decline', 'Second child can be born or adopted');
    Object.assign(parents,getChildProposalUpdates(parents,person,40,'adopt',()=>0.4));
    assert(parents.children.length===2 && parents.children[1].initialAge===5 && !createChildProposalEvent(parents,44) && createChildProposalEvent(parents,45), 'Each new child schedules another question five years later');
    Object.assign(parents,getChildProposalUpdates(parents,person,45,'decline'));
    assert(parents.childProposalStopped && !createChildProposalEvent(parents,50), 'Declining a later child closes the topic');
    assert(!createChildProposalEvent({...married(),nextChildProposalAge:91},91), 'No child proposals after 90');
    const born = married();
    const birth = getChildProposalUpdates(born,person,35,'accept',()=>0.4);
    completeLifeYear(born,35,birth);
    assert(born.children[0].initialAge===0 && born.money===964_000_000, 'Newborn costs are charged immediately');
    assert(!getChildcareExpenses(born,35).amount, 'Same-year reload does not double charge');
    completeLifeYear(born,53);
    assert(born.money===382_000_000 && getChildAge(born.children[0],53)===18, 'All costs through age 18 total 570 million');
    completeLifeYear(born,54);
    assert(born.money===358_000_000, 'No new childcare cost at age 19');
    const adopted = sameGender;
    completeLifeYear(adopted,35,getChildProposalUpdates(adopted,person,35,'accept',()=>0.4));
    assert(adopted.children[0].initialAge===5 && adopted.money===954_000_000, 'Adoption starts at age five with that age cost');
    completeLifeYear(adopted,48);
    assert(adopted.money===462_000_000, 'Adoption costs ages 5 through 18 total 490 million');
    completeLifeYear(adopted,49);
    assert(adopted.money===438_000_000, 'Adoption costs stop after 18');
    for(let age=1;age<=18;age++) assert(getAnnualChildcareCost(age)>getAnnualChildcareCost(age-1),'Costs increase with age');
    const poor = {...married(),money:5_000_000};
    completeLifeYear(poor,35,getChildProposalUpdates(poor,person,35,'accept',()=>0.4));
    assert(poor.money===-31_000_000 && poor.childcareDebt===0, 'Insufficient funds create a negative wallet balance');
    const legacy={money:0,childcareDebt:7_000_000};
    const legacyResult={money:-500_000};
    migrateChildcareDebt(legacy,legacyResult);
    assert(legacy.money===-7_000_000 && legacyResult.money===-7_500_000,'Old unpaid costs migrate into wallet and saved results');
    migrateChildcareDebt(legacy,legacyResult);
    assert(legacy.money===-7_000_000 && legacyResult.money===-7_500_000,'Reload does not subtract old costs twice');
    Object.assign(poor,{employmentStatus:'employed',careerLevel:1,careerPath:{id:'programming'},lastSalaryAge:35});
    completeLifeYear(poor,36);
     
    assert(poor.money===-31_000_000+120_000_000-14_000_000-24_000_000-9_600_000-1_860_000 && poor.childcareDebt===0,'Next salary covers current costs, living costs and the unpaid balance');
    const parent = {...married(),children:birth.children};
    Object.assign(parent,getBreakupUpdates(parent));
    assert(parent.children.length===1 && canStartRelationship(parent), 'Breakup preserves children and makes the player single');
    assert(!canStartRelationship(married()) && !createDatingEvent(married(),40) && !Object.keys(getDatingUpdates(married(),person,40)).length, 'Married players cannot start another relationship');
    const dating = {...base(),partner:person};
    assert(canStartRelationship(dating) && !Object.keys(getDatingUpdates(dating,person,40)).length,'Dating players may meet a second person but cannot add the same person twice');

    const html = await (await fetch('../index.html')).text();
    const parsed = new DOMParser().parseFromString(html,'text/html');
    parsed.querySelectorAll('script').forEach(element=>element.remove());
    parsed.querySelectorAll('[src]').forEach(element=>element.removeAttribute('src'));
    document.body.insertAdjacentHTML('beforeend',parsed.body.innerHTML);
    Object.assign(state,createInitialState());
    Object.assign(state.player,married(),{money:0,employmentStatus:'employed',careerLevel:1,
      careerPath:{id:'programming',field:'Công nghệ thông tin'},job:'Lập trình viên',lastSalaryAge:34,nextPromotionAge:null});
    const {achievements} = await import('../js/achievements/achievements-data.js');
    localStorage.setItem('lifeAgainAchievements',JSON.stringify(Object.fromEntries(achievements.map(item=>[item.id,true]))));
    localStorage.setItem('lifeAgainAchievementQueue','[]');
    document.getElementById('game-screen').hidden=false;
    document.getElementById('lobby-screen').hidden=true;
    Math.random=()=>0.99;
    await import('../js/main.js');
    const birthday=document.getElementById('age-up');
    const confirm=document.getElementById('event-confirm');
    const choose=index=>document.querySelectorAll('#event-choices button')[index].click();
    birthday.click();
    assert(state.pendingEvent.kind==='child-proposal' && state.pendingEvent.age===35,'Parenthood popup is guaranteed at its due age');
    choose(0);
    assert(state.player.children.length===0 && state.player.money===0,'Preview does not add children or deduct money');
    state.pendingEvent=JSON.parse(localStorage.getItem('lifeAgainSave')).pendingEvent;
    confirm.click();
    assert(state.player.children.length===1 && state.player.money===74_400_000 && state.player.achievementFlags['first-child'],'Confirm saved birth credits salary, charges newborn costs and unlocks achievement');
    assert(document.getElementById('money-value').textContent==='74,4 triệu','Wallet shows the net balance');
    birthday.click();
    assert(state.player.age===36 && state.player.money===146_800_000,'Year without a story still pays childcare after salary');
    document.getElementById('relationships').click();
    assert(!document.getElementById('breakup-relationship').hidden && document.getElementById('relationship-children').textContent.includes('1 tuổi'),'Relationships show breakup action and child age');
    document.getElementById('breakup-relationship').click();
    document.getElementById('cancel-breakup').click();
    assert(state.player.partner,'Cancelling leaves the marriage intact');
    document.getElementById('breakup-relationship').click();
    document.getElementById('confirm-breakup').click();
    assert(!state.player.partner && state.player.marriedAtAge===null && state.player.children.length===1,'Breakup button ends marriage but keeps the child');
    assert(JSON.parse(localStorage.getItem('lifeAgainSave')).player.partner===null,'Breakup persists');
    document.getElementById('close-relationships').click();
    birthday.click();
    assert(state.player.age===37 && state.player.money===217_200_000,'Childcare continues after breakup');
    Object.assign(state.player,{partner:person,marriedAtAge:null,relationshipStartedAtAge:37,nextMarriageProposalAge:42});
    document.getElementById('relationships').click();
    document.getElementById('breakup-relationship').click();
    document.getElementById('confirm-breakup').click();
    assert(!state.player.partner && state.player.relationshipHistory.at(-1).text.includes('chủ động chia tay'),'Breakup also works for an unmarried partner');
    document.getElementById('close-relationships').click();
    // A child request gives way to promotion and appears next year.
    Object.assign(state.player,{age:36,partner:person,marriedAtAge:32,nextChildProposalAge:37,
      childProposalStopped:false,childProposalCompleted:false,childProposalDeclines:0,
      careerLevel:2,nextPromotionAge:37,lastSalaryAge:36,careerSpark:'programming',
       
      moodEffects:[]});
    birthday.click();
    assert(state.pendingEvent.kind==='career-promotion' && state.player.nextChildProposalAge===38,'Promotion postpones parenthood request');
     
    choose(Math.max(0,state.pendingEvent.choices.findIndex(item=>item.correct)));
    confirm.click();
    birthday.click();
    assert(state.pendingEvent.kind==='child-proposal' && state.pendingEvent.age===38,'Postponed parenthood request returns');
    choose(1);confirm.click();
    assert(state.player.nextChildProposalAge===40,'Retry is two years after actual discussion');
    Object.assign(state.player,{money:5_000_000,employmentStatus:'declined',careerLevel:0,nextPromotionAge:null});
    birthday.click();
     
    assert(state.player.age===39 && state.player.money===-39_000_000,'Childcare can push the wallet below zero');
    assert(document.getElementById('money-value').textContent==='-39 triệu','Wallet displays the negative amount');
    state.player.children=[];
    birthday.click();
     
    state.pendingEvent.choices=[{label:'Pay',title:'Paid',text:'Paid',money:-5_000_000,effects:{}},{label:'Wait',title:'Waited',text:'Waited',effects:{}}];
    choose(0);
    assert(state.pendingEvent.stage==='choice','Paid choices are blocked while the wallet cannot cover them');
    choose(1);
    assert(state.pendingEvent.updates.money===undefined || state.pendingEvent.updates.money===-39_000_000,'A free choice keeps the negative balance');
    confirm.click();
     
    assert(state.player.money===-65_340_000 && document.getElementById('money-value').textContent==='-65,34 triệu','Confirm updates the negative wallet');
    assert(JSON.parse(localStorage.getItem('lifeAgainSave')).player.money===-65_340_000,'Negative balances persist');
    result.textContent='PASS: family, expenses, negative wallet, legacy debt migration, reload, salary, achievements, breakup and exclusivity';
  } catch(error) { result.textContent='FAIL: '+error.stack; }
  finally { Math.random=random; keys.forEach((key,index)=>previous[index]===null?localStorage.removeItem(key):localStorage.setItem(key,previous[index])); }
})();
</script>
