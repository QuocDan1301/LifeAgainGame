services:
  - type: web
    name: life-again-game
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run build && npm run test:server && npm run test:auction && npm run test:work && npm run test:game-center
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24
