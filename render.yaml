services:
  - type: web
    name: life-again-game
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm run test:account
    startCommand: npm start
    healthCheckPath: /api/account/status
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: ACCOUNT_STORAGE
        value: supabase
      - key: SUPABASE_URL
        value: https://qjxwgvcedzbdzsktyyof.supabase.co
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: COOKIE_SECURE
        value: 'true'
      - key: ADMIN_ACCOUNT_IDS
        sync: false
