  <ellipse cx="77" cy="101" rx="7" ry="4" fill="#f4a3a0" opacity="0.55"/>
  <ellipse cx="123" cy="101" rx="7" ry="4" fill="#f4a3a0" opacity="0.55"/>
  <path d="M91 104 Q100 113 109 104" stroke="#b5523f" stroke-width="3" stroke-linecap="round" fill="none"/>
