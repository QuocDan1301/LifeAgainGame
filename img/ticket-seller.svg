<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300" role="img" aria-labelledby="seller-title">
  <title id="seller-title">Nhân viên phát vé ở bến xe đang vẫy tay chào</title>
  <!-- Phong cách phẳng như ảnh nhân vật trong game: khối màu mềm, không viền, mắt chấm, má hồng nhạt. -->
