  <path d="M116 188 Q132 196 148 188 L148 189 Q148 182 141 182 L123 182 Q116 182 116 189 Z" fill="#8a5a3c"/>
  <circle cx="132" cy="193" r="2.6" fill="#f2c14e"/>
