  <rect x="102" y="198" width="25" height="82" rx="10" fill="#2e4870"/>
  <rect x="64" y="272" width="37" height="15" rx="7.5" fill="#3a3a4a"/>
  <rect x="99" y="272" width="37" height="15" rx="7.5" fill="#3a3a4a"/>
  <!-- Tay trái (bên phải ảnh) vẫy chào -->
