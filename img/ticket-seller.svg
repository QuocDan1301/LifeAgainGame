    <rect x="167" y="66" width="6" height="15" rx="3" transform="rotate(16 170 73)"/>
  </g>
  <!-- Thân áo -->
  <rect x="60" y="126" width="80" height="84" rx="24" fill="#8cc5e8"/>
  <path d="M100 128 L100 200" stroke="#7ab6dc" stroke-width="2.5"/>
  <circle cx="100" cy="150" r="2.4" fill="#5d93bd"/>
  <circle cx="100" cy="166" r="2.4" fill="#5d93bd"/>
  <circle cx="100" cy="182" r="2.4" fill="#5d93bd"/>
  <rect x="73" y="150" width="17" height="13" rx="3" fill="#7ab6dc"/>
  <rect x="110" y="150" width="17" height="13" rx="3" fill="#7ab6dc"/>
  <rect x="62" y="128" width="20" height="8" rx="4" fill="#2f4f7f"/>
  <rect x="118" y="128" width="20" height="8" rx="4" fill="#2f4f7f"/>
  <rect x="62" y="194" width="76" height="11" rx="5" fill="#2b3a55"/>
